name: Tests

on:
  push:
    branches: [main, development]
  pull_request:

jobs:
  test:
    name: Pest + Pint
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: uetype_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: uetype_test
      DB_USERNAME: root
      DB_PASSWORD: root
      BROADCAST_CONNECTION: 'null'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_mysql, bcmath, intl
          coverage: none

      - name: Copy environment file
        run: cp .env.example .env

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate application key
        run: php artisan key:generate

      - name: Check code style (Pint)
        run: vendor/bin/pint --test

      # Catches known CVEs and insecure-by-default packages before they ship. Reported
      # rather than blocking: a fresh advisory on a transitive dependency should not stop
      # an unrelated pull request, but it must be visible in the run.
      - name: Audit PHP dependencies
        run: composer audit --no-interaction || true

      - name: Install Node dependencies
        run: npm ci

      - name: Audit JS dependencies
        run: npm audit --audit-level=high || true

      # The JS unit tests (Vitest) had no CI step at all, so resources/js/*.test.js was
      # written but never executed anywhere -- it guarded nothing. Runs before the build so a
      # broken race/typing mechanic fails fast rather than after a full asset compile.
      - name: Run JS unit tests (Vitest)
        run: npm test

      - name: Build frontend assets
        run: npm run build

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run tests (Pest)
        # The full Blade-heavy suite exceeds PHP's 128M CLI default. Invoke Pest
        # directly so the per-process limit is applied to the actual test runner;
        # `php -d ... artisan test` would launch a child process without that flag.
        run: php -d memory_limit=512M vendor/bin/pest
